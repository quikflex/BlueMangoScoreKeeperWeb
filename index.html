<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlueMangoScoreKeeper</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px;
    background: #0b1020;
    color: #e5e7eb;
    font-family: system-ui, sans-serif;
}

main {
    max-width: 900px;
    margin: auto;
}

h1 { margin-bottom: 4px; }

.subtitle {
    color: #9ca3af;
    margin-top: 0;
    margin-bottom: 20px;
}

.terminal {
    border: 1px solid #334155;
    border-radius: 9px;
    overflow: hidden;
    background: #05070d;
}

.terminal-header {
    padding: 12px 16px;
    background: #111827;
    color: #cbd5e1;
    font-size: 13px;
}

#output {
    height: min(65vh, 600px);
    min-height: 320px;
    padding: 16px;
    overflow-y: auto;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font: 15px/1.55 monospace;
}

.line {
    min-height: 1.55em;
}

.blue { color: #60a5fa; }
.yellow { color: #facc15; }
.green { color: #4ade80; }
.red { color: #f87171; }
.purple { color: #c084fc; }

.input-line {
    display: flex;
    align-items: baseline;
    font: 15px/1.55 monospace;
    padding: 0 16px 16px;
    gap: 6px;
}

#prompt {
    white-space: pre-wrap;
}

#entry {
    min-width: 0;
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #e5e7eb;
    font: inherit;
    caret-color: white;
}

.controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 14px;
}

button {
    padding: 10px 16px;
    border: none;
    border-radius: 7px;
    background: #2563eb;
    color: white;
    font-weight: 600;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: default;
}

.status {
    padding: 10px 14px;
    background: #111827;
    color: #9ca3af;
    font-size: 12px;
}
</style>
</head>

<body>
<main>
    <h1>BlueMangoScoreKeeper</h1>
    <p class="subtitle">made by the GOAT waiwai, translated <br> for browser by andrei, shoutout liam</p>

    <div class="terminal">
        <div class="terminal-header">scorer.py (totally)</div>
        <div id="output"></div>
        <div class="input-line">
            <span id="prompt"></span>
            <input id="entry" autocomplete="off" autocapitalize="off"
                   spellcheck="false" aria-label="Terminal input">
        </div>
        <div class="status" id="status">Ready</div>
    </div>

    <div class="controls">
        <button id="restart">Restart match</button>
    </div>
</main>

<script>
const BLUE = "\x1b[94m";
const YELLOW = "\x1b[93m";
const GREEN = "\x1b[92m";
const RED = "\x1b[91m";
const PURPLE = "\x1b[95m";
const RESET = "\x1b[0m";

const output = document.getElementById("output");
const promptElement = document.getElementById("prompt");
const entry = document.getElementById("entry");
const status = document.getElementById("status");
const restartButton = document.getElementById("restart");

let inputResolver = null;
let gameFinished = false;
let matchStarted = false;

function escapeHTML(text) {
    return String(text).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function renderAnsi(text) {
    const colors = {
        "94": "blue",
        "93": "yellow",
        "92": "green",
        "91": "red",
        "95": "purple"
    };

    const parts = String(text).split(/(\x1b\[[0-9;]*m)/);
    let currentColor = "";
    let html = "";

    for (const part of parts) {
        const match = part.match(/^\x1b\[([0-9;]*)m$/);

        if (match) {
            currentColor = match[1] === "0" ? "" : (colors[match[1]] || "");
        } else {
            const safe = escapeHTML(part);
            html += currentColor
                ? `<span class="${currentColor}">${safe}</span>`
                : safe;
        }
    }

    return html;
}

function print(text = "") {
    const line = document.createElement("div");
    line.className = "line";
    line.innerHTML = renderAnsi(text);
    output.appendChild(line);
    output.scrollTop = output.scrollHeight;
}

function input(prompt = "") {
    return new Promise(resolve => {
        promptElement.innerHTML = renderAnsi(prompt);
        entry.value = "";
        inputResolver = resolve;
        entry.disabled = false;
        entry.focus();
        output.scrollTop = output.scrollHeight;
    });
}

entry.addEventListener("keydown", event => {
    if (event.key !== "Enter" || !inputResolver) return;

    event.preventDefault();

    const answer = entry.value;
    const promptText = promptElement.textContent;

    print(promptText + answer);

    const resolve = inputResolver;
    inputResolver = null;

    promptElement.textContent = "";
    entry.value = "";
    entry.disabled = true;

    resolve(answer);
});

function floor(value) {
    return Math.floor(value);
}

async function t_tennis(e_score) {
    print(`${PURPLE}Game to ${e_score}${RESET}`);

    const home_player = await input(`${BLUE}Home player/team: ${RESET}`);
    const away_player = await input(`${YELLOW}Away player/team: ${RESET}`);

    const game_type = (await input(
        `${BLUE}Are you playing Singles or Doubles? (s/d): ${RESET}`
    )).trim().toLowerCase();

    let h_team_player_1;
    let h_team_player_2;
    let a_team_player_1;
    let a_team_player_2;

    if (game_type === "d") {
        h_team_player_1 = await input(`Player 1 in ${home_player}: `);
        h_team_player_2 = await input(`Player 2 in ${home_player}: `);
        a_team_player_1 = await input(`Player 1 in ${away_player}: `);
        a_team_player_2 = await input(`Player 2 in ${away_player}: `);
    } else {
        h_team_player_1 = home_player;
        h_team_player_2 = home_player;
        a_team_player_1 = away_player;
        a_team_player_2 = away_player;
    }

    let h = 0;
    let a = 0;

    while (true) {
        const score = h + a;
        const inddig = (score / 8) - floor(score / 8);

        let player;
        let serve;
        let ord;

        if (inddig === 0.000) {
            player = h_team_player_1;
            serve = "1";
            ord = "st";
        } else if (inddig === 0.125) {
            player = h_team_player_1;
            serve = "2";
            ord = "nd";
        } else if (inddig === 0.250) {
            player = a_team_player_1;
            serve = "1";
            ord = "st";
        } else if (inddig === 0.375) {
            player = a_team_player_2;
            serve = "2";
            ord = "nd";
        } else if (inddig === 0.500) {
            player = h_team_player_2;
            serve = "1";
            ord = "st";
        } else if (inddig === 0.625) {
            player = h_team_player_2;
            serve = "2";
            ord = "nd";
        } else if (inddig === 0.750) {
            player = a_team_player_2;
            serve = "1";
            ord = "st";
        } else if (inddig === 0.875) {
            player = a_team_player_2;
            serve = "2";
            ord = "nd";
        }

        print(`${player}'s ${serve}${ord} serve`);

        const p = (await input(
            `P (${BLUE}h${RESET}/${YELLOW}a${RESET}): `
        )).trim().toLowerCase();

        if (p === "h") {
            h += 1;
        } else if (p === "a") {
            a += 1;
        } else {
            print(`${RED}Invalid input - enter 'h' or 'a'${RESET}`);
            continue;
        }

        print(
            `${BLUE}${home_player}: ${h}${RESET}  ` +
            `${YELLOW}${away_player}: ${a}${RESET}`
        );

        if ((h >= e_score || a >= e_score) && Math.abs(h - a) >= 2) {
            const winner = h > a ? home_player : away_player;
            const word = game_type === "S" ? "wins" : "win";
            print(`${GREEN}${winner} ${word}${RESET}`);
            break;
        }
    }
}

async function main() {
    let target = 11;

    const targetInput = await input("What score should the game go to? ");

    if (targetInput.trim() !== "") {
        const parsedTarget = Number.parseInt(targetInput, 10);

        if (Number.isNaN(parsedTarget)) {
            print(`${RED}Invalid target score, using default 11${RESET}`);
        } else {
            target = parsedTarget;
        }
    } else {
        print(`${RED}Invalid target score, using default 11${RESET}`);
    }

    await t_tennis(target);
}

async function startMatch() {
    if (matchStarted) return;

    matchStarted = true;
    gameFinished = false;
    restartButton.disabled = true;
    output.innerHTML = "";
    status.textContent = "Match in progress";

    try {
        await main();
        gameFinished = true;
        status.textContent = "Match finished";
    } catch (error) {
        print(`${RED}Error: ${error.message}${RESET}`);
        status.textContent = "Execution stopped";
    } finally {
        matchStarted = false;
        restartButton.disabled = false;
        entry.disabled = true;
    }
}

restartButton.addEventListener("click", () => {
    if (inputResolver) {
        const resolve = inputResolver;
        inputResolver = null;
        resolve("");
    }

    entry.disabled = true;
    startMatch();
});

entry.disabled = true;
startMatch();
</script>
</body>
</html>
