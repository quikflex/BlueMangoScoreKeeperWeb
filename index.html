<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BlueMangoScoreKeeper</title><style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#ddd;font:14px/1.45 monospace}
.terminal{width:min(100%,850px);margin:20px auto;padding:0 12px}
.bar{background:#303030;color:#ddd;padding:6px 10px;border:1px solid #484848;display:flex;justify-content:space-between}
.lights{color:#d7a85b}
.screen{border:1px solid #484848;border-top:0;padding:12px;min-height:350px;background:#101010;overflow:hidden;min-width:0}
.out{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;margin:0;max-width:100%}
.blue{color:#559bff}
.yellow{color:#e5d55a}
.green{color:#54d878}
.red{color:#ff6262}
.purple{color:#d68aff}
.inputrow{display:flex;align-items:baseline;gap:0;margin-top:7px;width:100%;min-width:0;max-width:100%;overflow:hidden}
.prompt{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;flex:0 1 auto;min-width:0;max-width:100%}
.inputrow input{flex:1 1 0;width:0;min-width:0;max-width:100%;background:transparent;border:0;outline:0;color:#ddd;font:inherit;caret-color:#ddd;padding:0;appearance:none;-webkit-appearance:none;border-radius:0}
.cursor{flex:0 0 auto;animation:blink 1s steps(2,start) infinite;pointer-events:none}
@keyframes blink{to{visibility:hidden}}
.hint{color:#777;font-size:12px;margin-top:10px}
@media(max-width:500px){.terminal{margin:0}.screen{min-height:100vh}.bar{border-left:0;border-right:0}}
</style></head><body><main class="terminal"><header class="bar"><span>BlueMangoScoreKeeper.py</span><span class="lights">● ● ●</span></header><section class="screen" id="screen"><div id="out"></div><form class="inputrow" id="form"><span class="prompt" id="prompt"></span><input id="cmd" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus><span class="cursor">▌</span></form><div class="hint">BlueMangoScoreKeeper // coded by Wai, translated to JavaScript by Andrei</div></section></main><script>
const $=id=>document.getElementById(id),out=$("out"),cmd=$("cmd"),form=$("form"),prompt=$("prompt");
const C={b:"blue",y:"yellow",g:"green",r:"red",p:"purple"};
let state="target",target=11,h=0,a=0,home_player="",away_player="",game_type="",names={},serve="",player="",ord="",finished=false;
function print(s="",c=""){let d=document.createElement("div");d.className="out "+(C[c]||"");d.textContent=s;out.append(d)}
function ask(s){prompt.innerHTML=s;cmd.value="";cmd.disabled=false;cmd.focus()}
function init(){print("What score should the game go to?");ask("")}
function start(){print("Game to "+target,"p");ask("Home player/team: ")}
function players(){print("Are you playing Singles or Doubles? (s/d): ","b");ask("");state="type"}
function begin(){h=0;a=0;state="point";next()}
function next(){
let score=h+a,inddig=score/8-Math.floor(score/8);
if(inddig===0){player=names.h1;serve="1";ord="st"}
else if(inddig===.125){player=names.h1;serve="2";ord="nd"}
else if(inddig===.250){player=names.a1;serve="1";ord="st"}
else if(inddig===.375){player=names.a2;serve="2";ord="nd"}
else if(inddig===.500){player=names.h2;serve="1";ord="st"}
else if(inddig===.625){player=names.h2;serve="2";ord="nd"}
else if(inddig===.750){player=names.a2;serve="1";ord="st"}
else if(inddig===.875){player=names.a2;serve="2";ord="nd"}
print(player+"'s "+serve+ord+" serve");ask("P ("+'<span class="blue">h</span>/<span class="yellow">a</span>'+"): ")
}
function score(p){
if(p==="h")h++;else if(p==="a")a++;else{print("Invalid input - enter 'h' or 'a'","r");return next()}
print(home_player+": "+h,"b");print(away_player+": "+a,"y");
if((h>=target||a>=target)&&Math.abs(h-a)>=2){
let winner=h>a?home_player:away_player,word=game_type==="S"?"wins":"win";
print(winner+" "+word,"g");finished=true;state="done";ask("Press Enter to restart: ");return
}
next()
}
form.addEventListener("submit",e=>{
e.preventDefault();if(cmd.disabled)return;
let v=cmd.value.trim(),raw=v;print(prompt.textContent+raw);cmd.value="";
if(state==="done"){out.innerHTML="";finished=false;state="target";h=0;a=0;target=11;init();return}
if(state==="target"){
try{target=parseInt(v,10);if(Number.isNaN(target))throw 0}catch{target=11;print("Invalid target score, using default 11","r")}
if(!v||Number.isNaN(parseInt(v,10)))target=11;
start();state="home";return}
if(state==="home"){home_player=v;state="away";ask("Away player/team: ");return}
if(state==="away"){away_player=v;state="type";ask("Are you playing Singles or Doubles? (s/d): ");return}
if(state==="type"){
game_type=v.toLowerCase();
if(game_type==="d"){state="h1";ask("Player 1 in "+home_player+": ")}
else{names={h1:home_player,h2:home_player,a1:away_player,a2:away_player};begin()}
return}
if(state==="h1"){names.h1=v;state="h2";ask("Player 2 in "+home_player+": ");return}
if(state==="h2"){names.h2=v;state="a1";ask("Player 1 in "+away_player+": ");return}
if(state==="a1"){names.a1=v;state="a2";ask("Player 2 in "+away_player+": ");return}
if(state==="a2"){names.a2=v;begin();return}
if(state==="point")score(v.toLowerCase())
});
init();
</script></body></html>
